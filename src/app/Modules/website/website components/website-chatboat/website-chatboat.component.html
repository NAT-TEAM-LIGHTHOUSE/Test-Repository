<div class="wrapper">
    <div id="main-div">
        <div id="main-button" class="wave open" (click)="toggleChat()" [ngClass]="{ 'open': isOpen }">
            <i [ngClass]="isOpen ? 'fa-solid fa-xmark' : 'fa-brands fa-rocketchat'"></i>
        </div>
        <a  class="wpforms-color" data-bs-toggle="offcanvas" data-bs-target="#offcanvasBottom"
            aria-controls="offcanvasBottom">
            <i class="fa-brands fa-wpforms"></i>
        </a>
        <a  class="comments-color">
            <i class="fa-solid fa-comments"></i>
        </a>
    </div>
</div>



<div class="offcanvas offcanvas-bottom" tabindex="-1" id="offcanvasBottom" aria-labelledby="offcanvasBottomLabel">
    <div class="offcanvas-header">
        <div class="form_title">
            <h5 class="offcanvas-title" id="offcanvasBottomLabel">Contact info</h5>
            <p>Please leave your contact info and we will contact you back</p>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close">x</button>
    </div>
    <div class="offcanvas-body">
        <form>
            <div class="form-floating mb-3">
                <input type="text" class="form-control" id="floatingInput" placeholder="name">
                <label for="floatingInput">Name</label>
            </div>
            <div class="form-floating mb-3">
                <input type="text" class="form-control" id="floatingphone" placeholder="phone">
                <label for="floatingphone">Phone</label>
            </div>
            <div class="form-floating mb-3">
                <input type="email" class="form-control" id="floatingemail" placeholder="Email">
                <label for="floatingemail">E-mail</label>
            </div>
            <div class="form-floating mb-3">
                <textarea class="form-control" placeholder="Leave a comment here" id="floatingTextarea"></textarea>
                <label for="floatingTextarea">Comment</label>
            </div>
            <div class="form-floating mb-3">
                <input type="text" class="form-control" id="floatingcompany" placeholder="company name">
                <label for="floatingcompany">Company name</label>
            </div>
            <div class="form-floating mb-3">
                <input type="text" class="form-control" id="floatingaddress" placeholder="Address">
                <label for="floatingaddress">Address</label>
            </div>
            <button type="button" class="btn btn-info W-100">Send</button>
        </form>
        
    </div>
</div>
